# Evidence-Based AI Root Cause Analysis — Docker Compose
# Brings up the entire system with a single `docker-compose up`

services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rcadb
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca_password
    ports:
      - "5432:5432"
    volumes:
      - ./services/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca -d rcadb"]
      interval: 5s
      timeout: 3s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector:0.115.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      analysis-engine:
        condition: service_started

  # ============================================================
  # MICROSERVICE TEST BED (Step 1)
  # ============================================================
  frontend-gateway:
    build:
      context: ./services
      dockerfile: frontend-gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      OTEL_SERVICE_NAME: frontend-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      ORDER_SERVICE_URL: http://order-service:3001
      AUTH_SERVICE_URL: http://auth-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3002
      ANALYSIS_ENGINE_URL: http://analysis-engine:3020
    depends_on:
      order-service:
        condition: service_started
      auth-service:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  order-service:
    build:
      context: ./services
      dockerfile: order-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      OTEL_SERVICE_NAME: order-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PAYMENT_SERVICE_URL: http://payment-service:3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rcadb
      DB_USER: rca
      DB_PASSWORD: rca_password
      ANALYSIS_ENGINE_URL: http://analysis-engine:3020
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  payment-service:
    build:
      context: ./services
      dockerfile: payment-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      OTEL_SERVICE_NAME: payment-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rcadb
      DB_USER: rca
      DB_PASSWORD: rca_password
      ANALYSIS_ENGINE_URL: http://analysis-engine:3020
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  auth-service:
    build:
      context: ./services
      dockerfile: auth-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      OTEL_SERVICE_NAME: auth-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      ANALYSIS_ENGINE_URL: http://analysis-engine:3020
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3003/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================
  # ANALYSIS & DETECTION (Steps 3-10)
  # ============================================================
  analysis-engine:
    build:
      context: ./services
      dockerfile: analysis-engine/Dockerfile
    ports:
      - "3020:3020"
    environment:
      PORT: 3020
      OTEL_SERVICE_NAME: analysis-engine
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rcadb
      DB_USER: rca
      DB_PASSWORD: rca_password
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: claude-sonnet-5
      ANALYSIS_ENGINE_URL: http://analysis-engine:3020
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3020/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  anomaly-detector:
    build:
      context: ./services/anomaly-detector
      dockerfile: Dockerfile
    ports:
      - "3010:3010"
    environment:
      ANALYSIS_ENGINE_URL: http://analysis-engine:3020
    depends_on:
      analysis-engine:
        condition: service_started

  # ============================================================
  # TRAFFIC GENERATOR (produces continuous traffic for telemetry)
  # ============================================================
  traffic-generator:
    image: node:20-alpine
    command: >
      sh -c "
        echo 'Waiting for services to start...' &&
        sleep 15 &&
        echo 'Starting traffic generation...' &&
        while true; do
          wget -q -O /dev/null http://frontend-gateway:3000/api/orders 2>/dev/null;
          wget -q -O /dev/null --post-data='{\"customer_name\":\"demo\",\"item\":\"widget\",\"quantity\":1,\"total_amount\":29.99}' --header='Content-Type: application/json' http://frontend-gateway:3000/api/orders 2>/dev/null;
          wget -q -O /dev/null --post-data='{\"token\":\"demo-token-12345\"}' --header='Content-Type: application/json' http://frontend-gateway:3000/api/auth/verify 2>/dev/null;
          sleep 3;
        done
      "
    depends_on:
      frontend-gateway:
        condition: service_started

  # ============================================================
  # DASHBOARD (Step 11)
  # ============================================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
    environment:
      VITE_ANALYSIS_ENGINE_URL: http://localhost:3020
      VITE_GATEWAY_URL: http://localhost:3000
    depends_on:
      analysis-engine:
        condition: service_started

volumes:
  pgdata:
